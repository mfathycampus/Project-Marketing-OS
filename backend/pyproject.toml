[project]
name = "marketing-os-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "anthropic>=0.40",
  "psycopg[binary]>=3.1",
  "pillow>=10",  # built-in design renderer + JPEG conversion for Instagram
  "playwright>=1.40",  # optional higher-fidelity renderer (needs: playwright install chromium)
  "cryptography>=42",  # encrypts stored tokens (Fernet)
  "httpx>=0.27",
  "arabic-reshaper>=3.0",  # Arabic shaping for the Pillow renderer (no browser needed)
  "python-bidi>=0.4",
  "imageio-ffmpeg>=0.5",  # bundled FFmpeg binary for video rendering (no separate install)
  "edge-tts>=7.0",  # free Arabic voiceover without a key (unofficial; ElevenLabs/Azure take priority when set)
  "python-multipart>=0.0.9",  # file uploads (media library)
  "tzdata>=2024.1",  # IANA timezones on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ugc = ["faster-whisper>=1.0"]  # speech-to-text for "your face" videos (installed by start.bat when possible)

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = ["real_music: use the real music generator (slow)"]
testpaths = ["tests"]

[project]
name = "marketing-os-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "anthropic>=0.40",
  "psycopg[binary]>=3.1",
  "pillow>=10",  # JPEG conversion for Instagram
  "tzdata>=2024.1",  # IANA timezones on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

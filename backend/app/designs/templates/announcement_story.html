<!doctype html><html dir="${DIR}"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:${WIDTH}px;height:${HEIGHT}px;font-family:"Tajawal","Noto Sans Arabic","DejaVu Sans",sans-serif;color:#fff;overflow:hidden}
body{background:linear-gradient(180deg,${PRIMARY},#0b1f1d);display:flex;flex-direction:column;justify-content:space-between;padding:140px 90px}
.brand{font-size:48px;opacity:.85}
h1{font-size:140px;line-height:1.25;font-weight:800}
p{font-size:54px;line-height:1.5;opacity:.9;margin-top:50px}

</style></head><body>
<div class="brand">${BRAND}</div><div><h1>${HEADLINE}</h1><p>${DESCRIPTION}</p></div><div class="cta">${CTA}</div>

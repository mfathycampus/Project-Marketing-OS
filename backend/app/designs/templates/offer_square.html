<!doctype html><html dir="${DIR}"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:${WIDTH}px;height:${HEIGHT}px;font-family:"Tajawal","Noto Sans Arabic","DejaVu Sans",sans-serif;color:#fff;overflow:hidden}
body{background:linear-gradient(135deg,${PRIMARY},#0b1f1d);display:flex;flex-direction:column;justify-content:space-between;padding:90px}
.brand{font-size:40px;opacity:.85}
h1{font-size:110px;line-height:1.25;font-weight:800}
.price{align-self:flex-start;display:inline-block;background:${SECONDARY};color:#1a1a1a;font-size:90px;font-weight:800;padding:10px 50px;border-radius:24px}
p{font-size:44px;opacity:.9;line-height:1.5}
.cta{align-self:flex-start;background:#fff;color:${PRIMARY};font-size:52px;font-weight:800;padding:22px 64px;border-radius:999px}
</style></head><body>
<div class="brand">${BRAND}</div>
<div><h1>${HEADLINE}</h1><p>${DESCRIPTION}</p></div>
<div class="price">${PRICE}</div>
<div class="cta">${CTA}</div>
</body></html>
